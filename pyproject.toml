[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "volume-tta"
version = "17.0.7"
description = "YOLO segmentation test-time augmentation for large cylindrical video volumes"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "opencv-python",
  "scipy",
  "tifffile",
  "tqdm",
  "ultralytics",
]

[project.optional-dependencies]
openvino = ["openvino"]
cuda12 = ["cupy-cuda12x", "nvidia-ml-py"]
acceleration = ["numba", "deflate", "isal"]

[project.scripts]
volume-tta = "volume_tta.__main__:run"

[tool.setuptools.packages.find]
include = ["volume_tta*"]
