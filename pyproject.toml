[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xta"
version = "18.0.3"
description = "YOLO segmentation pretraining and test-time augmentation for large volumes"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "opencv-python",
  "scipy",
  "tifffile",
  "tqdm",
  "ultralytics",
]

[project.optional-dependencies]
openvino = ["openvino"]
cuda12 = ["cupy-cuda12x>=13.0", "nvidia-ml-py"]
cuda13 = ["cupy-cuda13x>=13.0", "nvidia-ml-py"]
nvtiff12 = ["nvidia-nvtiff-cu12>=0.8"]
nvtiff13 = ["nvidia-nvtiff-cu13>=0.8"]
acceleration = ["numba", "deflate", "isal"]
pta = ["pynrrd", "albumentations"]

[project.scripts]
xta = "XTA.cli:run"

[tool.setuptools.packages.find]
include = ["XTA*"]

[tool.setuptools.package-data]
"XTA.examples.external_augmentations" = ["README.md"]

[tool.setuptools.data-files]
"share/xta" = [
  "ARCHITECTURE.md",
  "GPT-5.6-Sol-Ultra_v18.0.3_SLURM.py",
]
"share/xta/tools" = [
  "tools/v1803_hgx_selftest.py",
  "tools/v1803_d1_ipc_selftest.py",
]
