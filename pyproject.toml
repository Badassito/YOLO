[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "volume-tta"
version = "17.1.1"
description = "YOLO segmentation test-time augmentation for large cylindrical video volumes"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "opencv-python",
  "scipy",
  "tifffile",
  "tqdm",
  "ultralytics",
]

[project.optional-dependencies]
openvino = ["openvino"]
cuda12 = ["cupy-cuda12x>=13.0", "nvidia-ml-py"]
acceleration = ["numba", "deflate", "isal"]

[project.scripts]
volume-tta = "volume_tta.__main__:run"

[tool.setuptools.packages.find]
include = ["volume_tta*"]

[tool.setuptools.data-files]
"share/volume-tta" = [
  "ARCHITECTURE.md",
  "GPT-5.6-Sol-Ultra_v17.1.1_SLURM.py",
]
