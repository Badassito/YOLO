[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "volume-tta"
version = "18.0.0"
description = "YOLO segmentation pretraining and test-time augmentation for large volumes"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "opencv-python",
  "scipy",
  "tifffile",
  "tqdm",
  "ultralytics",
]

[project.optional-dependencies]
openvino = ["openvino"]
cuda12 = ["cupy-cuda12x>=13.0", "nvidia-ml-py"]
acceleration = ["numba", "deflate", "isal"]
pta = ["pynrrd", "albumentations"]

[project.scripts]
volume-tta = "XTA.cli:run"

[tool.setuptools.packages.find]
include = ["XTA*"]

[tool.setuptools.data-files]
"share/volume-tta" = [
  "ARCHITECTURE.md",
  "GPT-5.6-Sol-Ultra_v18.0.0_SLURM.py",
]
